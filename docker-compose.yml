services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: relay
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: devpassword
    ports:
      - "5432:5432"
    volumes:
      - relay_pg:/var/lib/postgresql/data
  api:
    build: ./backend
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://postgres:devpassword@postgres:5432/relay
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-me}
      JWT_EXPIRES_IN: 7d
      CORS_ORIGINS: http://localhost:8081,http://localhost:19006
    depends_on:
      - postgres
    ports:
      - "4000:4000"
volumes:
  relay_pg:
